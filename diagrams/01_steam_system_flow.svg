<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960">

  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .header-bg { fill: #0f172a; }
      .header-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #ffffff; }
      .header-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 600; fill: #fbbf24; }
      .node-box { fill: #ffffff; stroke: #1e293b; stroke-width: 2; rx: 8; ry: 8; }
      .node-box-warn { fill: #fffbeb; stroke: #d97706; stroke-width: 2; rx: 8; ry: 8; }
      .node-box-blue { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2; rx: 8; ry: 8; }
      .node-box-green { fill: #f0fdf4; stroke: #15803d; stroke-width: 2; rx: 8; ry: 8; }
      .node-box-red { fill: #fef2f2; stroke: #b91c1c; stroke-width: 2; rx: 8; ry: 8; }
      .node-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .node-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10.2px; fill: #334155; text-anchor: middle; }
      .pipe-red { fill: none; stroke: #dc2626; stroke-width: 3; }
      .pipe-orange { fill: none; stroke: #ea580c; stroke-width: 2.8; stroke-dasharray: 7,4; }
      .pipe-blue { fill: none; stroke: #2563eb; stroke-width: 3; }
      .pipe-cyan { fill: none; stroke: #0891b2; stroke-width: 3; }
      .pipe-green { fill: none; stroke: #16a34a; stroke-width: 3; }
      .flow-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #0f172a; }
      .zone-box { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 6,4; rx: 10; ry: 10; }
      .zone-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill: #334155; }
      .footer-bg { fill: #e2e8f0; }
      .footer-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #1e293b; }
    </style>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0891b2"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="960"/>
  <rect class="header-bg" x="0" y="0" width="1600" height="72"/>
  <text class="header-title" x="28" y="32">УЧЕБНАЯ ПРИНЦИПИАЛЬНАЯ СХЕМА 1: ПАРОВАЯ СИСТЕМА ПРЕДПРИЯТИЯ (ГЕНЕРАЦИЯ, РАСПРЕДЕЛЕНИЕ И ОТВОД КОНДЕНСАТА)</text>
  <text class="header-sub" x="28" y="54">УЧЕБНАЯ СХЕМА ПОТОКОВ И УЗЛОВ КОНТРОЛЯ (НЕ СХЕМА КОНКРЕТНОГО ПРЕДПРИЯТИЯ) | Раздел 1 Инженерной библиотеки</text>

  <!-- Zones -->
  <rect class="zone-box" x="20" y="88" width="390" height="790"/>
  <text class="zone-title" x="38" y="114">ЗОНА I. КОТЕЛЬНАЯ И ВОДОПОДГОТОВКА</text>

  <rect class="zone-box" x="430" y="88" width="530" height="790"/>
  <text class="zone-title" x="448" y="114">ЗОНА II. МАГИСТРАЛЬ ПАРА И РЕДУЦИРОВАНИЕ (PRV)</text>

  <rect class="zone-box" x="980" y="88" width="600" height="790"/>
  <text class="zone-title" x="998" y="114">ЗОНА III. ТЕПЛООБМЕННИК И УЗЕЛ КОНДЕНСАТООТВОДА</text>

  <!-- Node 1: Makeup water -->
  <rect class="node-box-blue" x="50" y="135" width="330" height="74"/>
  <text class="node-title" x="215" y="159">1. Химводоочистка (ХВО / Умягчение / RO)</text>
  <text class="node-text" x="215" y="179">Подпиточная вода (Makeup Water)</text>
  <text class="node-text" x="215" y="196">Контроль: жесткость, pH, уд. проводимость</text>

  <!-- Node 2: Deaerator -->
  <rect class="node-box-warn" x="50" y="255" width="330" height="92"/>
  <text class="node-title" x="215" y="279">2. Деаэратор и питательный бак</text>
  <text class="node-text" x="215" y="299">Удаление O₂ и CO₂ паром низкого давления</text>
  <text class="node-text" x="215" y="316">Смешение подпитки и возвратного конденсата</text>
  <text class="node-text" x="215" y="333">Контроль: T ≈ 102–105 °C, P деаэратора, уровень</text>

  <!-- Node 3: Feed pump -->
  <rect class="node-box" x="85" y="390" width="260" height="58"/>
  <text class="node-title" x="215" y="414">3. Питательный насос котла</text>
  <text class="node-text" x="215" y="434">Защита от кавитации (подпор NPSH / T воды)</text>

  <!-- Node 4: Steam Boiler -->
  <rect class="node-box-red" x="50" y="492" width="330" height="126"/>
  <text class="node-title" x="215" y="516">4. Паровой котел и экономайзер</text>
  <text class="node-text" x="215" y="536">Генерация насыщенного пара P₁ (высокое давление)</text>
  <text class="node-text" x="215" y="554">Контроль: уровень воды (водоуказатели и LWCO),</text>
  <text class="node-text" x="215" y="571">давление пара P₁, T уходящих газов, O₂/CO,</text>
  <text class="node-text" x="215" y="588">исправность предохранительного клапана (Safety Valve)</text>

  <!-- Node 5: Blowdown -->
  <rect class="node-box" x="50" y="665" width="330" height="92"/>
  <text class="node-title" x="215" y="689">5. Непрерывная и нижняя продувка (Blowdown)</text>
  <text class="node-text" x="215" y="709">Контроль электропроводности (оценка TDS, напр. BCSR3)</text>
  <text class="node-text" x="215" y="726">Расширитель продувки (вторичный пар в деаэратор)</text>
  <text class="node-text" x="215" y="743">и теплообменник подогрева холодной подпитки</text>

  <!-- Zone II Nodes -->
  <!-- Node 6: Steam Header & Separator -->
  <rect class="node-box-red" x="455" y="160" width="480" height="102"/>
  <text class="node-title" x="695" y="185">6. Паровой коллектор P₁, сепаратор влаги и дренажи</text>
  <text class="node-text" x="695" y="205">Отделение капельной влаги для подачи сухого насыщенного пара (x → 1.0)</text>
  <text class="node-text" x="695" y="223">Уклон паропровода по ходу пара; отбор на потребители СВЕРХУ трубы!</text>
  <text class="node-text" x="695" y="241">Дренажные карманы (Drip Legs) каждые 30–50 м и перед подъемами</text>

  <!-- Node 7: Drip Leg Trap -->
  <rect class="node-box-warn" x="455" y="315" width="250" height="78"/>
  <text class="node-title" x="580" y="339">7. Узел дренажа магистрали</text>
  <text class="node-text" x="580" y="359">Грязевик + Конденсатоотводчик</text>
  <text class="node-text" x="580" y="376">(термодинамический TD или стакан)</text>

  <!-- Node 8: PRV Station -->
  <rect class="node-box-red" x="455" y="450" width="480" height="130"/>
  <text class="node-title" x="695" y="475">8. Редукционная станция (PRV — Pressure Reducing Valve)</text>
  <text class="node-text" x="695" y="495">Вентиль → Сепаратор с КО → Фильтр (Y-strainer, корзиной вбок!)</text>
  <text class="node-text" x="695" y="513">→ Манометр P₁ → Клапан PRV → Манометр P₂ → Предохр. клапан P₂</text>
  <text class="node-text" x="695" y="531">Снижение давления P₁ → P₂ повышает долю скрытой теплоты h_fg</text>
  <text class="node-text" x="695" y="549">и снижает плотность пара (меньше потери при утечках)</text>

  <!-- Zone III Nodes -->
  <!-- Node 9: Control Valve & Air Vent -->
  <rect class="node-box-red" x="1010" y="160" width="545" height="96"/>
  <text class="node-title" x="1282" y="185">9. Узел подачи пара на аппарат (P₂ → P₃)</text>
  <text class="node-text" x="1282" y="205">Фильтр + Регулирующий клапан температуры (TCV) + Манометр P₃</text>
  <text class="node-text" x="1282" y="223">+ Автоматический воздушник (Thermostatic Air Vent) и вакуумный прерыватель</text>
  <text class="node-text" x="1282" y="241">(Воздух — мощный теплоизолятор и причина углекислотной коррозии!)</text>

  <!-- Node 10: Heat Exchanger -->
  <rect class="node-box-warn" x="1010" y="308" width="545" height="122"/>
  <text class="node-title" x="1282" y="333">10. Паровой теплообменник / варочный аппарат цеха</text>
  <text class="node-text" x="1282" y="353">Пар отдает скрытую теплоту парообразования h_fg при T_sat(P₃)</text>
  <text class="node-text" x="1282" y="371">и превращается в насыщенный конденсат при той же температуре T_sat(P₃)</text>
  <text class="node-text" x="1282" y="389">Нагреваемый продукт: T_вх → T_вых (контроль датчиком TT)</text>
  <text class="node-text" x="1282" y="407">Недопустимо затопление парового пространства конденсатом (Stall)!</text>

  <!-- Node 11: Steam Trap Station -->
  <rect class="node-box-green" x="1010" y="482" width="545" height="145"/>
  <text class="node-title" x="1282" y="507">11. Узел конденсатоотводчика (Steam Trap Station)</text>
  <text class="node-text" x="1282" y="527">Вентиль → Грязевик с продувкой → Поплавковый КО (F&amp;T, серия Armstrong J)</text>
  <text class="node-text" x="1282" y="545">со встроенным воздушником → Смотровое стекло / Проверочный кран → Обратный клапан</text>
  <text class="node-text" x="1282" y="563">(При противодавлении &gt; P₃ — механический насос-КО TLV PowerTrap GT/GP)</text>
  <text class="node-text" x="1282" y="581">Диагностика: 1) Ультразвук + 2) Температура T_вх / T_вых + 3) Визуально</text>
  <text class="node-text" x="1282" y="599">Отказы: Холодный (Blocked — затопление) vs Пролет пара (Blowing — потери)</text>

  <!-- Node 12: Condensate Return Line -->
  <rect class="node-box-blue" x="455" y="765" width="1100" height="92"/>
  <text class="node-title" x="1005" y="790">12. Магистраль возврата конденсата (Двухфазный поток: конденсат + вторичный пар вскипания Flash Steam)</text>
  <text class="node-text" x="1005" y="810">Контроль качества перед возвратом в котельную: датчик электропроводности (Conductivity), мутности / жира / pH</text>
  <text class="node-text" x="1005" y="828">При попадании продукта — автоматический 3-ходовой клапан сбрасывает поток в дренаж для защиты котла!</text>

  <!-- Pipes & Arrows -->
  <path class="pipe-blue" d="M 215 209 L 215 253" marker-end="url(#arrow-blue)"/>
  <text class="flow-label" x="224" y="236">Химочищенная вода</text>

  <path class="pipe-blue" d="M 215 347 L 215 388" marker-end="url(#arrow-blue)"/>
  <path class="pipe-blue" d="M 215 448 L 215 490" marker-end="url(#arrow-blue)"/>
  <text class="flow-label" x="224" y="474">Питательная вода (104 °C)</text>

  <!-- 4 -> 5 -->
  <path class="pipe-orange" d="M 160 618 L 160 663" marker-end="url(#arrow-orange)"/>
  <text class="flow-label" x="62" y="646">Продувка TDS</text>
  <!-- 5 -> 2 (Flash steam from blowdown) -->
  <path class="pipe-orange" d="M 50 710 L 32 710 L 32 300 L 48 300" marker-end="url(#arrow-orange)"/>

  <!-- 4 -> 6 (Main steam P1) -->
  <path class="pipe-red" d="M 380 540 L 418 540 L 418 205 L 453 205" marker-end="url(#arrow-red)"/>
  <text class="flow-label" x="412" y="425" transform="rotate(-90 412,425)">Острый пар P₁</text>

  <!-- 6 -> 7 (Drip leg) -->
  <path class="pipe-red" d="M 580 262 L 580 313" marker-end="url(#arrow-red)"/>
  <!-- 7 -> 12 -->
  <path class="pipe-orange" d="M 580 393 L 580 422 L 442 422 L 442 795 L 453 795" marker-end="url(#arrow-orange)"/>

  <!-- 6 -> 8 (Branch taken from TOP of header!) -->
  <path class="pipe-red" d="M 790 160 L 790 135 L 947 135 L 947 475 L 937 475" marker-end="url(#arrow-red)"/>
  <text class="flow-label" x="720" y="129">Отбор СВЕРХУ коллектора</text>

  <!-- 8 -> 9 (Reduced steam P2) -->
  <path class="pipe-red" d="M 935 515 L 968 515 L 968 205 L 1008 205" marker-end="url(#arrow-red)"/>
  <text class="flow-label" x="962" y="410" transform="rotate(-90 962,410)">Редуцированный пар P₂</text>

  <!-- 9 -> 10 -->
  <path class="pipe-red" d="M 1282 256 L 1282 306" marker-end="url(#arrow-red)"/>
  <text class="flow-label" x="1292" y="286">Пар P₃ в аппарат</text>

  <!-- 10 -> 11 -->
  <path class="pipe-green" d="M 1282 430 L 1282 480" marker-end="url(#arrow-green)"/>
  <text class="flow-label" x="1292" y="460">Насыщенный конденсат P₃</text>

  <!-- 11 -> 12 -->
  <path class="pipe-orange" d="M 1282 627 L 1282 763" marker-end="url(#arrow-orange)"/>
  <text class="flow-label" x="1292" y="700">Конденсат + вторичный пар вскипания</text>

  <!-- 12 -> 2 (Return to Deaerator) -->
  <path class="pipe-green" d="M 455 825 L 396 825 L 396 315 L 382 315" marker-end="url(#arrow-green)"/>
  <text class="flow-label" x="391" y="750" transform="rotate(-90 391,750)">Возврат чистого конденсата в деаэратор</text>

  <rect class="footer-bg" x="0" y="896" width="1600" height="64"/>
  <text class="footer-text" x="36" y="920" font-weight="700">Источники инженерных принципов: [S01] US DOE Steam Sourcebook (DOE/GO-102012-3423, printed pp. 1–49 / PDF pp. 7–55); [S02] Armstrong J-Series F&amp;T IOM (IB-48-EN);</text>
  <text class="footer-text" x="36" y="942">Продолжение источников: [S03] Armstrong Inverted Bucket IOM (IB-19-A-EN); [S04] Spirax Sarco TDC Traps (IM-2-5162-US); [S06] Spirax Sarco BCSR3; [S07] TLV PowerTrap Manual.</text>
</svg>
