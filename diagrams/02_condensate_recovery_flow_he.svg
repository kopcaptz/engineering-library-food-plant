<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960">

  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .header-bg { fill: #0f172a; }
      .header-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #ffffff; }
      .header-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 600; fill: #fbbf24; }
      .node-box { fill: #ffffff; stroke: #1e293b; stroke-width: 2; rx: 8; ry: 8; }
      .node-box-warn { fill: #fffbeb; stroke: #d97706; stroke-width: 2; rx: 8; ry: 8; }
      .node-box-blue { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2; rx: 8; ry: 8; }
      .node-box-green { fill: #f0fdf4; stroke: #15803d; stroke-width: 2; rx: 8; ry: 8; }
      .node-box-red { fill: #fef2f2; stroke: #b91c1c; stroke-width: 2; rx: 8; ry: 8; }
      .node-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .node-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10.2px; fill: #334155; text-anchor: middle; }
      .pipe-red { fill: none; stroke: #dc2626; stroke-width: 3; }
      .pipe-orange { fill: none; stroke: #ea580c; stroke-width: 2.8; stroke-dasharray: 7,4; }
      .pipe-blue { fill: none; stroke: #2563eb; stroke-width: 3; }
      .pipe-cyan { fill: none; stroke: #0891b2; stroke-width: 3; }
      .pipe-green { fill: none; stroke: #16a34a; stroke-width: 3; }
      .flow-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #0f172a; }
      .zone-box { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 6,4; rx: 10; ry: 10; }
      .zone-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill: #334155; }
      .footer-bg { fill: #e2e8f0; }
      .footer-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #1e293b; }
          .header-title, .header-sub, .zone-title, .flow-label, .footer-text { text-anchor: end; }
    </style>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0891b2"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="960"/>
  <rect class="header-bg" x="0" y="0" width="1600" height="72"/>
  <text class="header-title" x="28" y="32" direction="rtl" unicode-bidi="embed">תרשים עקרוני לימודי 2‏: ‏איסוף והשבת קונדנסט‏, קיטור שניוני ומאזן חדר הדוודים</text>
  <text class="header-sub" x="28" y="54" direction="rtl" unicode-bidi="embed">תרשים זרימה ונקודות בקרה לימודי ‏(‏אינו שרטוט של מפעל ספציפי‏)‏ | פרק 2 בספרייה ההנדסית</text>

  <!-- Zones -->
  <rect class="zone-box" x="20" y="88" width="470" height="600"/>
  <text class="zone-title" x="38" y="114" direction="rtl" unicode-bidi="embed">אזור I‏. איסוף קונדנסט וקיטור שניוני מהתפשטות ‏(FLASH)‏</text>

  <rect class="zone-box" x="510" y="88" width="535" height="600"/>
  <text class="zone-title" x="528" y="114" direction="rtl" unicode-bidi="embed">אזור II‏. בקרת איכות ‏(‏מוליכות‏)‏ ותחנות שאיבת קונדנסט</text>

  <rect class="zone-box" x="1065" y="88" width="515" height="600"/>
  <text class="zone-title" x="1083" y="114" direction="rtl" unicode-bidi="embed">אזור III‏. מאזן מים‏, מלחים ואנרגיה בחדר הדוודים</text>

  <!-- Node 1: HP Traps -->
  <rect class="node-box-red" x="42" y="155" width="426" height="112"/>
  <text class="node-title" x="255" y="180" direction="rtl" unicode-bidi="embed">1. מלכודות קיטור של צרכנים בלחץ גבוה ‎‭P₁‬‎</text>
  <text class="node-text" x="255" y="200" direction="rtl" unicode-bidi="embed">ביציאה מהמתקנים הקונדנסט נמצא בטמפרטורת רוויה ‎‭T_sat(P₁)‬‎</text>
  <text class="node-text" x="255" y="218" direction="rtl" unicode-bidi="embed">ובאנתלפיית נוזל רווי ‎‭h_f(P₁)‬‎ ‏(‏למשל ‎‭721 kJ/kg‬‎ ב-‎‭7 barg‬‎‏)‏</text>
  <text class="node-text" x="255" y="236" direction="rtl" unicode-bidi="embed">אחרי המלכודת הלחץ צונח ל-‎‭P₂‬‎ ‏←‏ עודף האנתלפיה הופך מיידית</text>
  <text class="node-text" x="255" y="253" direction="rtl" unicode-bidi="embed">חלק מהנוזל לקיטור שניוני מהתפשטות ‏(Flash Steam)‏‏!</text>

  <!-- Node 2: Flash Vessel -->
  <rect class="node-box-warn" x="42" y="325" width="426" height="148"/>
  <text class="node-title" x="255" y="350" direction="rtl" unicode-bidi="embed">2. מכל הפרדת קיטור שניוני ‏(Flash Steam Vessel)‏</text>
  <text class="node-text" x="255" y="370" direction="rtl" unicode-bidi="embed">שיעור הקיטור השניוני‏: ‏‎‭x_flash = [h_f(P₁) − h_f(P₂)] / h_fg(P₂)‬‎</text>
  <text class="node-text" x="255" y="388" direction="rtl" unicode-bidi="embed">יציאה עליונה‏: ‏קיטור שניוני יבש בלחץ נמוך ‎‭P₂‬‎</text>
  <text class="node-text" x="255" y="406" direction="rtl" unicode-bidi="embed">‏(‏מוזן לדה-אירטור‏, מים חמים‏, CIP או מחממים בטמפ׳ נמוכה‏)‏</text>
  <text class="node-text" x="255" y="424" direction="rtl" unicode-bidi="embed">יציאה תחתונה ‏(‏דרך מלכודת F&amp;T‏)‏‏: ‏קונדנסט נוזלי ב-‎‭T_sat(P₂)‬‎</text>
  <text class="node-text" x="255" y="442" direction="rtl" unicode-bidi="embed">חיסכון‏: ‏משמר ‎‭8–18%‬‎ מהמסה ו-‎‭40–50%‬‎ מאנרגיית הזרם‏!</text>

  <!-- Node 3: Low Pressure Users -->
  <rect class="node-box-green" x="42" y="540" width="426" height="110"/>
  <text class="node-title" x="255" y="566" direction="rtl" unicode-bidi="embed">3. צרכני קיטור שניוני בלחץ נמוך ‎‭P₂‬‎</text>
  <text class="node-text" x="255" y="586" direction="rtl" unicode-bidi="embed">חימום מים לשטיפות ‏(CIP)‏‏, ‏פסטור‏, חימום מים ודה-אירטור</text>
  <text class="node-text" x="255" y="604" direction="rtl" unicode-bidi="embed">שסתום שמירת לחץ והשלמת קיטור ‏(‎‭Backpressure / Makeup PRV‬‎)‏</text>
  <text class="node-text" x="255" y="622" direction="rtl" unicode-bidi="embed">לשמירה על מאזן לחץ יציב בקו הקיטור השניוני</text>

  <!-- Node 4: Conductivity Monitoring & Dump Valve -->
  <rect class="node-box-warn" x="535" y="155" width="485" height="142"/>
  <text class="node-title" x="777" y="180" direction="rtl" unicode-bidi="embed">4. מכלול בקרת איכות אוטומטית של הקונדנסט</text>
  <text class="node-text" x="777" y="200" direction="rtl" unicode-bidi="embed">רגש מוליכות חשמלית סגולית ‏(‎‭Conductivity Sensor, µS/cm‬‎)‏</text>
  <text class="node-text" x="777" y="218" direction="rtl" unicode-bidi="embed">עם פיצוי טמפרטורה ‏+ רגש ‎‭pH /‬‎ עכירות ‎‭/‬‎ שומן</text>
  <text class="node-text" x="777" y="236" direction="rtl" unicode-bidi="embed">קונדנסט נקי‏: ‏מוליכות נמוכה ‏(‎‭~10–30 µS/cm‬‎)‏‏;</text>
  <text class="node-text" x="777" y="254" direction="rtl" unicode-bidi="embed">בפריצת מחליף חום ‏(‏חלב‏, מיץ‏, תמלחת‏, CIP‏)‏ ‏←‏ זינוק חד במוליכות EC‏!</text>
  <text class="node-text" x="777" y="272" direction="rtl" unicode-bidi="embed">בחריגה מהסף‏: ‏ברז תלת-דרכי מפנה אוטומטית את הזרם לניקוז</text>

  <!-- Node 5: Emergency Drain -->
  <rect class="node-box-red" x="535" y="345" width="230" height="76"/>
  <text class="node-title" x="650" y="370" direction="rtl" unicode-bidi="embed">5. הפניה אוטומטית לניקוז חירום</text>
  <text class="node-text" x="650" y="390" direction="rtl" unicode-bidi="embed">בעת זיהום הקונדנסט במוצר</text>
  <text class="node-text" x="650" y="407" direction="rtl" unicode-bidi="embed">‏(‏הגנה על הדוד מפני הקצפה וגלישה‏)‏</text>

  <!-- Node 6: Condensate Recovery Unit (CRU / PowerTrap) -->
  <rect class="node-box-blue" x="535" y="465" width="485" height="190"/>
  <text class="node-title" x="777" y="490" direction="rtl" unicode-bidi="embed">6. תחנת שאיבת קונדנסט ‏(‏שני סוגי הנעה‏)‏</text>
  <text class="node-text" x="777" y="510" direction="rtl" unicode-bidi="embed">חלופה א׳‏: ‏תחנה חשמלית ‏(‏Spirax Sarco CRU‏, מכל איסוף ‏+ משאבות צנטריפוגליות‏)‏</text>
  <text class="node-text" x="777" y="528" direction="rtl" unicode-bidi="embed">מגבלה‏: ‏סכנת קוויטציה כאשר טמפ׳ הקונדנסט ‎‭> 95–98 °C‬‎ ‏(‏נדרש עומד NPSHa‏)‏</text>
  <text class="node-text" x="777" y="548" direction="rtl" unicode-bidi="embed">חלופה ב׳‏: ‏משאבת-מלכודת מכנית מונעת קיטור ‏(‎‭TLV PowerTrap GT/GP‬‎)‏</text>
  <text class="node-text" x="777" y="566" direction="rtl" unicode-bidi="embed">שואבת קונדנסט רותח ‏(‎‭100+ °C‬‎)‏ בלחץ קיטור דוחף ללא חלקים מסתובבים וללא קוויטציה‏!</text>
  <text class="node-text" x="777" y="586" direction="rtl" unicode-bidi="embed">קו איזון ופליטה ‏(‎‭Balancing / Exhaust Line‬‎)‏‏: ‏לחלל הקיטור</text>
  <text class="node-text" x="777" y="604" direction="rtl" unicode-bidi="embed">‏(‏מערכת סגורה‏)‏ או לאטמוספרה ‏(‏מערכת פתוחה עם ניקוז חופשי‏)‏</text>
  <text class="node-text" x="777" y="622" direction="rtl" unicode-bidi="embed">הגנת צנרת מפני קורוזיית חומצה פחמתית ‏(‎‭CO₂‬‎)‏ וחמצן ‏(‎‭O₂‬‎)‏</text>

  <!-- Node 7: Boiler Feed Tank & Deaerator Balance -->
  <rect class="node-box-green" x="1090" y="155" width="465" height="205"/>
  <text class="node-title" x="1322" y="180" direction="rtl" unicode-bidi="embed">7. דה-אירטור ומכל מי הזנה בחדר הדוודים ‏(‏מאזן‏)‏</text>
  <text class="node-text" x="1322" y="202" direction="rtl" unicode-bidi="embed">כניסה 1‏: ‏קונדנסט מוחזר ‏(‏שיעור השבה ‎‭R_cond = m_cond / m_steam‬‎‏)‏</text>
  <text class="node-text" x="1322" y="220" direction="rtl" unicode-bidi="embed">כניסה 2‏: ‏קיטור שניוני ממכל התפשטות הניקוזים וממפריד הקונדנסט</text>
  <text class="node-text" x="1322" y="238" direction="rtl" unicode-bidi="embed">כניסה 3‏: ‏מי תוספת קרים מטיפול מים‎‭/RO‬‎ ‏(‏שיעור השלמה ‎‭1 − R_cond‬‎‏)‏</text>
  <text class="node-text" x="1322" y="262" direction="rtl" unicode-bidi="embed">התועלת המשולשת של השבת קונדנסט גבוהה‏:</text>
  <text class="node-text" x="1322" y="280" direction="rtl" unicode-bidi="embed">1) חיסכון ישיר בדלק הדוד ‏(‏הקונדנסט נושא כ-‎‭15–25%‬‎ מאנתלפיית הקיטור‏)‏</text>
  <text class="node-text" x="1322" y="298" direction="rtl" unicode-bidi="embed">2) חיסכון ישיר במים גולמיים‏, מלח‏, כימיקלים ואגרות שפכים</text>
  <text class="node-text" x="1322" y="316" direction="rtl" unicode-bidi="embed">3) הורדת מליחות מי ההזנה TDS ‏←‏ צמצום דרמטי של ניקוזי הדוד‏!</text>

  <!-- Node 8: Blowdown Heat Recovery -->
  <rect class="node-box-warn" x="1090" y="425" width="465" height="210"/>
  <text class="node-title" x="1322" y="452" direction="rtl" unicode-bidi="embed">8. דוד הקיטור ומערכת השבת חום מניקוזי דוד</text>
  <text class="node-text" x="1322" y="474" direction="rtl" unicode-bidi="embed">שיעור הניקוז‏: ‏‎‭BD = TDS_feed / (TDS_boiler_max − TDS_feed)‬‎</text>
  <text class="node-text" x="1322" y="494" direction="rtl" unicode-bidi="embed">ככל ששיעור הקונדנסט הנקי ‎‭R_cond‬‎ גבוה יותר‏, מליחות ‎‭TDS_feed‬‎ נמוכה יותר</text>
  <text class="node-text" x="1322" y="512" direction="rtl" unicode-bidi="embed">ופחות מי דוד רותחים מוזרמים לניקוז‏!</text>
  <text class="node-text" x="1322" y="536" direction="rtl" unicode-bidi="embed">השבת חום דו-שלבית מניקוז הדוד ‏(‎‭US DOE Tip Sheet #9 [S22]‬‎)‏‏:</text>
  <text class="node-text" x="1322" y="554" direction="rtl" unicode-bidi="embed">שלב 1‏: ‏מכל התפשטות ניקוזים ‏←‏ קיטור שניוני לדה-אירטור</text>
  <text class="node-text" x="1322" y="572" direction="rtl" unicode-bidi="embed">שלב 2‏: ‏מחליף חום ‏"מי ניקוז ‎‭/‬‎ מי תוספת קרים‏"</text>
  <text class="node-text" x="1322" y="590" direction="rtl" unicode-bidi="embed">‏(‏חימום מי ההזנה בכל ‎‭+6 °C‬‎ חוסך כ-‎‭1%‬‎ מתצרוכת הדלק של הדוד‏!‏)‏</text>

  <!-- Summary Formula Box -->
  <rect class="node-box" x="20" y="706" width="1560" height="172"/>
  <text class="node-title" x="800" y="732" direction="rtl" unicode-bidi="embed">משוואות חישוב ובקרה מרכזיות לפרק 2 ‏(‏קונדנסט וקיטור שניוני‏)‏</text>
  <text class="node-text" x="800" y="756" direction="rtl" unicode-bidi="embed">1) שיעור קיטור שניוני‏: ‏‎‭x_flash (%) = [ (h_f1 − h_f2) / h_fg2 ] × 100%‬‎‏   |   2) ‏חיסכון באנרגיית דלק בהשבת קונדנסט‏: ‏‎‭Q_sav = m_cond · (h_f_cond − h_f_makeup) / η_boiler‬‎</text>
  <text class="node-text" x="800" y="780" direction="rtl" unicode-bidi="embed">3) מליחות מי הזנה מעורבבים‏: ‏‎‭TDS_feed = (1 − R_cond)·TDS_makeup + R_cond·TDS_cond‬‎‏   |   4) ‏שיעור ניקוז הדוד‏: ‏‎‭BD = TDS_feed / (TDS_boiler − TDS_feed)‬‎</text>
  <text class="node-text" x="800" y="804" direction="rtl" unicode-bidi="embed">5) כלל מרווח אנטי-קוויטציה ‏(NPSHa)‏‏: ‏במכל איסוף אטמוספרי כל ‎‭+1‬‎ מ׳ עומד נוזל מעל יניקת המשאבה מאפשר להעלות את טמפרטורת הקונדנסט המרבית בכ-‎‭+2 °C‬‎‏.</text>
  <text class="node-text" x="800" y="828" direction="rtl" unicode-bidi="embed">6) בקרת קו הקונדנסט‏: ‏התחממות חריגה ורעש בתדר גבוה אחרי מלכודת מעידים על פריצת קיטור חי‏, וירידת pH מתחת ל-‎‭7.0‬‎ מעידה על קורוזיה חומצית מ-‎‭CO₂‬‎‏.</text>

  <!-- Pipes & Arrows -->
  <path class="pipe-orange" d="M 255 267 L 255 323" marker-end="url(#arrow-orange)"/>
  <text class="flow-label" x="265" y="300" direction="rtl" unicode-bidi="embed">זרימה דו-פאזית ‏(‎‭P₁ → P₂‬‎)‏</text>

  <!-- 2 -> 3 (Flash steam out bottom-left to LP users) -->
  <path class="pipe-red" d="M 140 473 L 140 538" marker-end="url(#arrow-red)"/>
  <text class="flow-label" x="150" y="512" direction="rtl" unicode-bidi="embed">קיטור שניוני ‎‭P₂‬‎ למפעל</text>

  <!-- 2 -> 7 (Flash steam to Deaerator via top channel above boxes) -->
  <path class="pipe-red" d="M 42 355 L 28 355 L 28 132 L 1322 132 L 1322 153" marker-end="url(#arrow-red)"/>
  <text class="flow-label" x="730" y="125" direction="rtl" unicode-bidi="embed">קיטור שניוני ‎‭P₂‬‎ לדה-אירטור בחדר הדוודים</text>

  <!-- 2 -> 4 (Liquid condensate out right) -->
  <path class="pipe-green" d="M 468 415 L 498 415 L 498 215 L 533 215" marker-end="url(#arrow-green)"/>
  <text class="flow-label" x="492" y="355" transform="rotate(-90 492,355)" direction="rtl" unicode-bidi="embed">קונדנסט נוזלי ‎‭P₂‬‎</text>

  <!-- 3 -> 4 (Condensate from LP users) -->
  <path class="pipe-green" d="M 468 595 L 498 595 L 498 240 L 533 240" marker-end="url(#arrow-green)"/>

  <!-- 4 -> 5 (Dump to drain on high conductivity) -->
  <path class="pipe-red" d="M 650 297 L 650 343" marker-end="url(#arrow-red)"/>
  <text class="flow-label" x="660" y="325" direction="rtl" unicode-bidi="embed">בזיהום ‏(‏מוליכות EC גבוהה‏)‏</text>

  <!-- 4 -> 6 (Clean condensate to pump station) -->
  <path class="pipe-green" d="M 850 297 L 850 463" marker-end="url(#arrow-green)"/>
  <text class="flow-label" x="860" y="385" direction="rtl" unicode-bidi="embed">קונדנסט נקי ‏(‏EC תקין‏)‏</text>

