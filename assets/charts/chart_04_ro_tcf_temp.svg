<text x="94" y="86" font-family="Arial, sans-serif" font-size="10.2" font-weight="bold" fill="#0f172a">Пример нормализации DuPont [S16, Eq. 72–74 (298 и 273), PDF p. 131–133]:</text>
<text x="94" y="103" font-family="Arial, sans-serif" font-size="9.6" fill="#334155">• Пуск (15 °C, Y=75%, TCF=0.70336246≈0.70, NDP=20.0 бар): Q_ps = 150.0 м³/ч</text>
<text x="94" y="119" font-family="Arial, sans-serif" font-size="9.6" fill="#dc2626">• Зима (10 °C, Y=72%, TCF=0.58441151≈0.58, π_fc=2.72≈2.7 бар): Q_po = 127.0 м³/ч (−15.33%)</text>
<text x="94" y="135" font-family="Arial, sans-serif" font-size="9.6" font-weight="bold" fill="#15803d">• Округл. учебный пример S16 (0.70/0.58, NDP 20/21.3): Q_s = 143.92 ≈ 144 м³/ч (−4.05%)</text>
<text x="94" y="151" font-family="Arial, sans-serif" font-size="9.6" fill="#0f766e">• По Eq. 74 (298/273) без промеж. округления (NDP 20/21.28): Q_s = 143.6556 → 143.66 м³/ч (−4.23%)</text>
