<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" role="img" aria-label="График температурного коэффициента TCF обратного осмоса по S16, Eq. 73–74, PDF p. 131–133">
<rect width="100%" height="100%" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="380" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.8" font-weight="bold" fill="#0f172a">ГРАФИК 4. Температурный поправочный коэффициент потока пермеата TCF (база 25 °C = 1.00) [S16, Eq. 73–74, PDF p. 131]</text>
<text x="380" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#475569">Формула DuPont: TCF = exp[K · (1/298 − 1/(273 + T))], где K = 3020 при T ≤ 25 °C (Eq. 74) и K = 2640 при T ≥ 25 °C (Eq. 73)</text>
